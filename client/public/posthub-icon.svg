<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2d78"/>
      <stop offset="55%" stop-color="#1454c8"/>
      <stop offset="100%" stop-color="#06225e"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbe8ff"/>
    </linearGradient>
    <linearGradient id="pencil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36a8ff"/>
      <stop offset="100%" stop-color="#1262e8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Rounded app tile -->
  <rect x="18" y="18" width="476" height="476" rx="92" fill="url(#bg)"/>

  <!-- Stylized P / chat mark -->
  <path d="M126 118h166c73 0 119 42 119 105 0 64-47 105-119 105h-65v62h-76V118zm101 64v82h60c30 0 48-15 48-41 0-27-18-41-48-41h-60z"
        fill="white" filter="url(#shadow)"/>

  <!-- Chat bubble inside P -->
  <path d="M177 184h102c25 0 43 16 43 38s-18 38-43 38h-59l-28 20v-20h-15v-76z"
        fill="#0b2d78"/>
  <circle cx="212" cy="222" r="8" fill="white"/>
  <circle cx="240" cy="222" r="8" fill="white"/>
  <circle cx="268" cy="222" r="8" fill="white"/>

  <!-- Paper -->
  <path d="M133 354l235 0-32 103-238 0z" fill="url(#paper)" filter="url(#shadow)"/>
  <path d="M151 381h153M143 407h137M135 433h166"
        stroke="#86aeea" stroke-width="9" stroke-linecap="round"/>

  <!-- Pencil -->
  <g transform="rotate(-35 333 342)" filter="url(#shadow)">
    <rect x="307" y="242" width="48" height="155" rx="8" fill="url(#pencil)"/>
    <rect x="307" y="242" width="48" height="24" rx="8" fill="#1e73e8"/>
    <rect x="307" y="242" width="48" height="13" fill="#ffbf2f"/>
    <path d="M307 397h48l-24 40z" fill="#f2c28b"/>
    <path d="M325 425l6 12 6-12z" fill="#17345f"/>
    <path d="M307 242h48l-10-22h-28z" fill="#ffc52f"/>
  </g>
</svg>
